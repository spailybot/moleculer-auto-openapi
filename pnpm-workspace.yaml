packages:
  - '!examples/**'

# Allow-list: only these packages may run build scripts (pnpm v9+ supply-chain policy).
onlyBuiltDependencies:
  - esbuild

# Deny-list: these packages have build scripts that are explicitly refused.
# Declaring them here suppresses ERR_PNPM_IGNORED_BUILDS.
neverBuiltDependencies:
  - '@scarf/scarf'
