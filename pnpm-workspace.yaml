packages:
  - '!examples/**'

# pnpm 11+ build script policy
# allowBuilds: explicit per-package allow/deny of build scripts.
# 'true'  = allowed to run postinstall/install scripts
# 'false' = explicitly denied (suppresses ERR_PNPM_IGNORED_BUILDS warning)
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
